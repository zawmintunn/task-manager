name: Task Manager Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Upload browser reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            artifacts/qa-task-manager-*.png
